<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="FrikiMusic logo">
  <defs>
    <linearGradient id="bg" x1="42" y1="38" x2="470" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171126"/>
      <stop offset="0.52" stop-color="#100D1E"/>
      <stop offset="1" stop-color="#08070E"/>
    </linearGradient>
    <linearGradient id="wave" x1="145" y1="145" x2="372" y2="367" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CFF"/>
      <stop offset="0.5" stop-color="#C64BDF"/>
      <stop offset="1" stop-color="#FF5B9C"/>
    </linearGradient>
    <linearGradient id="waveSoft" x1="154" y1="164" x2="356" y2="358" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BEA8FF"/>
      <stop offset="1" stop-color="#FFB4D4"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(256 256) rotate(90) scale(196)">
      <stop stop-color="#9B5CFF" stop-opacity=".2"/>
      <stop offset=".64" stop-color="#D450D9" stop-opacity=".055"/>
      <stop offset="1" stop-color="#D450D9" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="3"/>
  <circle cx="256" cy="256" r="196" fill="url(#halo)"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#B86BFF" stroke-opacity=".19" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#FF78B3" stroke-opacity=".08" stroke-width="1" stroke-dasharray="2 10"/>
  <g fill="url(#wave)" filter="url(#glow)">
    <rect x="120" y="218" width="38" height="76" rx="19"/>
    <rect x="177" y="174" width="42" height="164" rx="21"/>
    <rect x="235" y="128" width="44" height="256" rx="22"/>
    <rect x="293" y="174" width="42" height="164" rx="21"/>
    <rect x="354" y="218" width="38" height="76" rx="19"/>
  </g>
  <g fill="url(#waveSoft)" opacity=".72" filter="url(#smallGlow)">
    <circle cx="139" cy="202" r="4"/>
    <circle cx="198" cy="157" r="4"/>
    <circle cx="257" cy="111" r="4"/>
    <circle cx="314" cy="157" r="4"/>
    <circle cx="373" cy="202" r="4"/>
  </g>
  <path d="M155 355C190 381 223 394 256 394C289 394 322 381 357 355" fill="none" stroke="#EFA2FF" stroke-opacity=".36" stroke-width="2" stroke-linecap="round"/>
</svg>
